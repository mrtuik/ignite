name: react-native-android-build-apk

on:
  push:
    branches:
      - main   # <-- gitpush.html commits to the repo's default branch (main), not "master"
  workflow_dispatch: {}  # lets you trigger a build manually from the Actions tab too

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # no "cache: npm" here — that needs a package-lock.json,
          # which this repo doesn't have

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install npm dependencies
        run: npm install   # not "npm ci" — that also requires a lock file

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive
        # Ignite is an Expo-managed project (no committed /android folder),
        # so this step creates it before Gradle can build anything.

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
