name: GitPush • ignite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: gitpush-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITPUSH_APP_NAME: "ignite"
      GITPUSH_SPLASH: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Detect lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo "has_lock=true" >> $GITHUB_OUTPUT; else echo "has_lock=false" >> $GITHUB_OUTPUT; fi

      - name: Setup Node (npm cache)
        if: steps.lock.outputs.has_lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Node (no lockfile)
        if: steps.lock.outputs.has_lock != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules (fallback)
        if: steps.lock.outputs.has_lock != 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ github.repository }}-nodemodules-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-nodemodules-
      - name: Install dependencies
        run: npm ci || npm install

      - name: Build React Native Web bundle
        run: npm run build --if-present || npx expo export --platform web

      - name: Package web build
        run: |
          OUT=$( [ -d dist ] && echo dist || ([ -d build ] && echo build || echo web-build) )
          mkdir -p gitpush-src && cp -r "$OUT"/. gitpush-src/
          (cd gitpush-src && zip -qr ../tuik-web.zip .)
      - name: Rename output
        run: |
          mkdir -p gitpush-out
          FILE=$(ls -1 tuik-web.zip 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then echo "No build output matched tuik-web.zip" && exit 1; fi
          cp "$FILE" "gitpush-out/tuik.zip"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ignite@gitpush
          path: gitpush-out/tuik.zip
          if-no-files-found: error
